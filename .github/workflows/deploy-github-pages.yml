name: GitHub Pages Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build (Next.js static export with pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. リポジトリを取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. pnpm を有効化
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. Node.js セットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 4. GitHub Pages 用の環境設定
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 5. 依存関係のインストール
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6. Next.js ビルド（static export → out/ 生成）
      - name: Build
        run: pnpm run build
        env:
          # ルート直下で配信する Pages の場合は空でOK
          # https://<random>.pages.github.io/
          BASE_PATH: ""

      # 7. Jekyll 無効化（_next/ 対策）
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # 8. ビルド成果物を Pages artifact としてアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
